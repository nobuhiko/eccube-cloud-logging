name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            monolog: '^2.9'
          - php: '8.1'
            monolog: '^2.9'
          - php: '8.1'
            monolog: '^3.0'
          - php: '8.3'
            monolog: '^2.9'
          - php: '8.3'
            monolog: '^3.0'
          - php: '8.4'
            monolog: '^3.0'
    name: PHP ${{ matrix.php }} / Monolog ${{ matrix.monolog }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
      - run: composer update --no-interaction --no-progress --with-all-dependencies --with "monolog/monolog:${{ matrix.monolog }}"
      - run: vendor/bin/phpunit
